<!doctype html><html prefix="og:http://ogp.me/ns#" lang="ru"><head><meta http-equiv="Content-type" content="text/html; charset=utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,minimal-ui"><link rel="manifest" href="/manifest.json" crossorigin="use-credentials"><link rel="icon" type="image/x-icon" href="/favicon.ico"><meta name="theme-color" content="#000"><title data-rh="true">Мне звонят в дверь, говорят: «Откройте, полиция!» Что делать? — Meduza</title> <meta data-rh="true" property="og:site_name" content="Meduza"/><meta data-rh="true" property="og:title" content="Мне звонят в дверь, говорят: «Откройте, полиция!» Что делать? — Meduza"/><meta data-rh="true" property="og:url" content="https://meduza.io/cards/mne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"/><meta data-rh="true" property="og:locale" content="ru_RU"/><meta data-rh="true" property="fb:pages" content="375587425929352"/><meta data-rh="true" property="fb:app_id" content="944674498882174"/><meta data-rh="true" name="facebook-domain-verification" content="oy14jw4lf4va7ny1oby3u57hnhn03t"/><meta data-rh="true" property="al:web:should_fallback" content="true"/><meta data-rh="true" name="incorrect-apple-itunes-app" content="app-id=921508170"/><meta data-rh="true" name="incorrect-google-play-app" content="app-id=io.meduza.android"/><meta data-rh="true" name="twitter:site" content="@meduzaproject"/><meta data-rh="true" name="twitter:title" content="Мне звонят в дверь, говорят: «Откройте, полиция!» Что делать? — Meduza"/><meta data-rh="true" property="og:type" content="article"/><meta data-rh="true" name="twitter:card" content="summary_large_image"/><meta data-rh="true" property="al:ios:url" content="meduza://?id=cards/mne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"/><meta data-rh="true" property="al:android:url" content="meduza://?id=cards/mne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"/><meta data-rh="true" property="al:android:package" content="io.meduza.android"/><meta data-rh="true" name="keywords" content="новости, политика, расследование, репортаж, интервью, реакция, исследование, опрос, тест, президент, приговор, доллар, нефть, экономика, цены, средства, информация, компания, фото, видео, украина, сепаратисты, война, краткий пересказ, бестселлер"/><meta data-rh="true" name="description" content="Да, но это еще не значит, что к вам не может прийти полицейский. На вас может пожаловаться сосед снизу, которому не нравится громкая музыка. Или управляющая компания вместе с полицией решит провести рейд для выявления людей, живущих без регистрации. Так что на всякий случай нужно быть готовым к визиту людей в форме. «Медуза» попросила экспертов проекта Комитета гражданских инициатив «Открытая полиция» дать несколько ключевых советов по теме."/><meta data-rh="true" property="og:description" content="Да, но это еще не значит, что к вам не может прийти полицейский. На вас может пожаловаться сосед снизу, которому не нравится громкая музыка. Или управляющая компания вместе с полицией решит провести рейд для выявления людей, живущих без регистрации. Так что на всякий случай нужно быть готовым к визиту людей в форме. «Медуза» попросила экспертов проекта Комитета гражданских инициатив «Открытая полиция» дать несколько ключевых советов по теме."/><meta data-rh="true" name="twitter:description" content="Да, но это еще не значит, что к вам не может прийти полицейский. На вас может пожаловаться сосед снизу, которому не нравится громкая музыка. Или управляющая компания вместе с полицией решит провести рейд для выявления людей, живущих без регистрации. Так что на всякий случай нужно быть готовым к визиту людей в форме. «Медуза» попросила экспертов проекта Комитета гражданских инициатив «Открытая полиция» дать несколько ключевых советов по теме."/><meta data-rh="true" property="og:image" content="https://meduza.io/imgly/share/1565965779/cards/mne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"/><meta data-rh="tru     window.mdzAppState = {"app":{"isInApp":false,"isEmbedded":false,"isPreview":false,"isMobile":true,"screen_view_type":"GRID","exchangeRatesRequestStatus":"idle","bannersRequestStatus":"idle","banners":null,"isFetchInitiated":false},"audioPlayer":{"playingEpisodeUrl":null,"byId":{}},"banners":{"top":true,"right":false,"bottom":true},"currentUser":{"daily":{"subscribed":false,"error":false},"sos":{"subscribed":false,"error":false},"lang":"ru","last_opened_material":{"version":14,"url":"cards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat","content":{"head":[{"type":"tag","data":{"text":"разбор","theme":"gold"},"id":"0-aa138dd880aa804c7d7622e725dcd915353a5ca64dda7bb6c2280a36ffd03999"},{"type":"rich_title","data":{"first":"Мне звонят в дверь, говорят: «Откройте, полиция!» Что делать?"},"id":"1-3fd3d014daaeaac7b4b6299c01e016218c46993d849f50fc9e07ba5494279372"},{"type":"meta","data":{"lang":"ru","components":[{"type":"items_count","count":17,"id":"2a0c3d74d0a441b9222bb13163e08810227f3038fc562751eaf7692f450778f2"},{"type":"datetime","datetime":1463120037,"format":"date","id":"c346ca58791a949f9fd9842fa630697dda11e0c40abaf61ce6bc8c0962c80308"}]},"id":"2-884d331e66678e8bde2fac5a0888c59f5a8fe0a290465e52508ad175e26e7867"}],"cards":[{"blocks":[{"type":"card_title","data":{"index":1,"text":"Зачем мне это знать? Я же не преступник"},"id":"0-0-e6076217967a51cb213881144aa143dba51e7f35dfb4e1439b20db578c74e604"},{"type":"p","data":"Да, но это еще не значит, что к вам не может прийти полицейский. На вас может пожаловаться сосед снизу, которому не нравится громкая музыка. Или управляющая компания вместе с полицией решит провести рейд для выявления людей, живущих без регистрации. Так что на всякий случай нужно быть готовым к визиту людей в форме. «Медуза» попросила экспертов проекта \u003Ca href=\"https:\u002F\u002Fkomitetgi.ru\u002F\" rel=\"noopener\"\u003EКомитета гражданских инициатив\u003C\u002Fa\u003E \u003Ca href=\"http:\u002F\u002Fopenpolice.ru\u002F\" rel=\"noopener\"\u003E«Открытая полиция»\u003C\u002Fa\u003E дать несколько ключевых советов по теме.","length":445,"id":"0-1-2c3bbc53ed023df35b3524ab4bd254a018b9099bcb940f4c18f0a54fc6b4d573"}]},{"blocks":[{"type":"card_title","data":{"index":2,"text":"Хорошо. И что же делать, если в мою дверь звонит полицейский?"},"id":"1-0-0f84ef441c7e4503d9b5971ea5e4148b6939ee15441ab1440388cfe43e5dd204"},{"type":"p","data":"В первую очередь убедитесь, что к вам пришел именно полицейский. Попросите его представиться и предъявить служебное удостоверение в «глазок» или через цепочку. После того как полицейский представился, попросите его подождать и перепишите все данные. Сообщите о визите полиции родственникам или друзьям, продиктуйте им фамилию, имя, отчество, звание и должность сотрудника. Узнайте цель и причину визита сотрудника к вам домой, после чего примите решение, открывать дверь или нет.","length":479,"id":"1-1-b203e79ff6557220f984606d7d44f5ec0216f31e404c21b80cfeea944de2a231"}]},{"blocks":[{"type":"card_title","data":{"index":3,"text":"Как-то неловко заставлять человека ждать"},"id":"2-0-b777917c5e83ea7bd1a1737a1261cd92afd8bdbdfd20158fc51cb61f50893010"},{"type":"p","data":"Ничего страшного. Соблюдение законности и ваших прав, как и ваша безопасность, важнее этикета.","length":94,"id":"2-1-93aa81f3ba40a831f2687023b73f5fcb95554fca91a98221ebf111e7747605f6"}]},{"blocks":[{"type":"card_title","data":{"index":4,"text":"А если полицейский отказывается представляться?"},"id":"3-0-a86f391191b2f198999fc80449f5815de56b099d9c063ae3f60b23f34d9b38c8"},{"type":"p","data":"Тогда ни в коем случае не открывайте дверь. Звоните по номеру 112, своему участковому или в дежурную часть отдела полиции (телефон обычно можно быстро найти в интернете).","length":170,"id":"3-1-8d415317e4f5b0ab398f1f5f92bae2a19e24a687501200d563b73fa960dce2df"}]},{"blocks":[{"type":"card_title","data":{"index":5,"text":"Если не хочу открывать, полицейский имеет право сломать дверь?"},"id":"4-0-37eeb8ac8de847973704c64fd2a38ff883013bbc1ef1e6c0460f598f9dfe41d5"},{"type":"p","data":"Только в экстренных случаях. Все они прописаны в \u003Ca href=\"https:\u002F\u002Fwww.consultant.ru\u002Fdocument\u002Fcons_doc_LAW_110165\u002F3ff2278c1111420030bcbeb1f40164cf760b700e\u002F\" rel=\"noopener\"\u003Eстатье 15 закона «О полиции»\u003C\u002Fa\u003E.","length":78,"id":"4-1-b74e5767da8c525d962d41c4c0c5e3871fb9d67762089a1043044bd52c4604b6"},{"type":"p","data":"Вот список случаев, когда полицейский может войти в квартиру против вашей воли:","length":79,"id":"4-2-2508013eab6d20ec734051aa7cd3c9c47d05120c382ac3c2cb2fb19920fb5ad2"},{"type":"p","data":"1) для спасения жизни граждан и (или) их имущества, обеспечения безопасности граждан или общественной безопасности при массовых беспорядках и чрезвычайных ситуациях;","length":165,"id":"4-3-ac994e75632a7f4f340cf5e684c2f4a3c4687c39fa62bd26fda6d4f734d58d8f"},{"type":"p","data":"2) для задержания лиц, подозреваемых в совершении преступления;","length":63,"id":"4-4-d5010ce430fdf0f6b21f43944f3dbf6834c0471c87778af7317fbc3869e09d8b"},{"type":"p","data":"3) для пресечения преступления;","length":31,"id":"4-5-577032b7bd56213df392acf79f48fb0d60cc5818a3f5507746fad2a2065c1fa8"},{"type":"p","data":"4) для установления обстоятельств несчастного случая.","length":53,"id":"4-6-f5c0fd2f9ebb9cf20311eea42e22e6b0809714a87c4d2b6728fb8b9aaa8aba45"},{"type":"p","data":"Таким образом, если в вашей квартире не скрывается преступник, не совершается преступление, нет угрозы жизни или имуществу, а также не произошел несчастный случай, полицейский может войти к вам домой исключительно с вашего согласия. ","length":233,"id":"4-7-a0a401b3d133f959b17edd9ed4c332dd5f42153e43b3c49b92b852efe72490b5"}]},{"blocks":[{"type":"card_title","data":{"index":6,"text":"Полицейский говорит, что в квартире совершено преступление (или скрывается подозреваемый), хотя это ерунда. Что делать?"},"id":"5-0-6ecfeeacde7ee23b28f088d2ec27da75fe6ae64660cb389844bec3186b90530a"},{"type":"p","data":"Включите диктофон на телефоне и предупредите сотрудника, что вы ведете запись. Попросите его назвать номер КУСП или КРСП (так и произносите эти аббревиатуры, это покажет, что вы в теме), т. е. номер регистрации материала в книге учета сообщений о преступлениях \u002F сообщений о происшествиях, и дату регистрации. И телефон дежурной части — чтобы вы могли проверить, что такой материал проверки или сообщение зарегистрировано (даже если вам не скажут этого в дежурной части, ваш звонок туда будет записан). Скажите сотруднику следующее: «Если вы назовете мне номер регистрации сообщения, я подчинюсь вашим требованиям, но затем я обязательно обжалую факт проверки моей квартиры и попрошу прокуратуру и суд проверить весь материал, так как не считаю, что у вас на самом деле есть основания». ","length":787,"id":"5-1-50221d71108e2eee699d9dd60deff70cbcfd4dca861c9a68b2d3ef8386287163"}]},{"blocks":[{"type":"card_title","data":{"index":7,"text":"Сотрудник полиции просто требует открыть дверь, хотя своих целей не объясняет. Как себя вести?"},"id":"6-0-00c092ef77a9e6ab86b6d4bbe4fb73f4c975d3c9449dbd5177ae29d72484298b"},{"type":"p","data":"Вежливо, но строго. В случае, если визит полицейского не имеет законных оснований, спокойно сообщите сотруднику, что его действия неправомерны, предупредите его об уголовной ответственности за превышение полномочий, а также оставьте жалобу по телефону 112. Если полицейский говорит, что хочет «просто побеседовать», предложите ему оставить вам повестку или уточнить время и место приема. ","length":388,"id":"6-1-68a7f64dac2155cf89bef52bb021dc449200372f457d761650935177dc9ed288"}]},{"blocks":[{"type":"card_title","data":{"index":8,"text":"А если я уже открыл дверь и впустил полицейского в квартиру?"},"id":"7-0-007e61bf6b4f8fbd4c8022aa7c4310ed99865457accde059a95ac97f30a712fd"},{"type":"p","data":"Еще раз попросите его показать служебное удостоверение. Сверьте данные. Помните, что действия сотрудника, проникшего к вам в дом, должны быть ограничены рамками служебной необходимости. Тщательно фиксируйте все происходящее на мобильный телефон. И не забывайте: вы в любое время можете попросить полицейского покинуть квартиру.","length":327,"id":"7-1-17b13f6d99eb666d2b090f7a8e40adfc7ac6945be70ef603ff48b53704e14978"}]},{"blocks":[{"type":"card_title","data":{"index":9,"text":"С полицейским пришли сотрудники управляющих компаний. Нужно ли впускать их?"},"id":"8-0-a185a21756618a973fdc2ff5a7b474c81d33eed04bb3d66fa0274fe36abb9064"},{"type":"p","data":"Нет. Сотрудники управляющих компаний и частных охранных предприятий не имеют таких прав, как полиция. Пускать их в дом или нет — исключительно ваше дело. Даже если у полицейского есть законные основания войти к вам в дом, вы можете впустить полицию, а всех остальных оставить за дверью. ","length":287,"id":"8-1-fe59845b010a2f91586a9a87a264186a510ef0c4245fb0afc0e515622692d9ab"}]},{"blocks":[{"type":"card_title","data":{"index":10,"text":"Как поступить, если квартира, в которой я живу, съемная и полицейский требует предъявить договор аренды?"},"id":"9-0-a3e3a41f4bab9a1a11874f147395ef042a07140c849b1a8a033c7f8e5b86d5c0"},{"type":"p","data":"Напомнить полицейскому, что это требование незаконно. Аренда жилого помещения является элементом гражданско-правовых отношений. Сотрудники полиции не вправе проверять законность гражданских сделок. Поэтому просьбы полицейского предоставить договор аренды незаконны.","length":265,"id":"9-1-9b36af3ae3d4ac942b50fe3320572263cb2c4e1ed431a65c32a94b21c2e7bdc5"}]},{"blocks":[{"type":"card_title","data":{"index":11,"text":"Что делать, если у меня нет регистрации?"},"id":"10-0-82f173dbbd4311e21877dac9bacb71481975cf38d9a69999de00c12713f1285c"},{"type":"p","data":"В таком случае полицейский может составить протокол или вручить вам повестку для дачи объяснений. И то и другое можно сделать на лестничной площадке. Впускать его в квартиру вы не обязаны.","length":188,"id":"10-1-94f66d9c2aed7e56efb4939dde00403c42f461b4bfac73591684978edafe099e"}]},{"blocks":[{"type":"card_title","data":{"index":12,"text":"В каких случаях мою квартиру могут обыскать?"},"id":"11-0-38271fb3c8f9f9f17318c5fda11bc508a8ceb198bb9b5e8fd5fefd05b9796a8d"},{"type":"p","data":"Обыск в квартире проводится только на основании решения суда в рамках возбужденного уголовного дела. В исключительных случаях может быть постановление следователя. Во всех прочих случаях обыск незаконен. ","length":204,"id":"11-1-4db79ff3394732c6a861b765e7ba04bbd82672e3f97d113acca29be205b7df9f"},{"type":"p","data":"Перед началом обыска вам обязаны предъявить соответствующее постановление об обыске, а после — вручить копию протокола. ","length":120,"id":"11-2-e00926ff50f7031676ef780df32b5370790519d86ee1cbd02f512ca278d8ce8c"},{"type":"p","data":"Однако помимо обыска есть еще такое процессуальное действие, как «осмотр». Осмотр возможен до возбуждения уголовного дела, он может быть проведен в рамках проверки сообщения о преступлении. В теории уголовного процесса осмотр не подразумевает «переворачивания квартиры вверх дном», но на практике обыск и осмотр ничем не отличаются. Для осмотра квартиры нужно ваше согласие, а копия протокола вам не положена. ","length":410,"id":"11-3-a437f199671d4ecbf3df25558bb5a1af93a5ff65443eb5fdc1aa8ffb5900fa3b"}]},{"blocks":[{"type":"card_title","data":{"index":13,"text":"А если я не соглашаюсь на обыск или осмотр?"},"id":"12-0-eb3e17399e69f810f94c23d5eaaa11d28bcaad5d092aa8bb9a73129886fdc310"},{"type":"p","data":"И обыск, и осмотр можно провести без вашего согласия по постановлению следователя и по решению суда (они должны быть у полицейских, если проведение этих процедур поручено им). Решение суда о законности обыска или осмотра вы можете обжаловать в вышестоящем суде. Постановление следователя об осмотре или обыске будет направлено в суд в течение 24 часов для проверки законности, вы можете также успеть подать свою жалобу в районный суд.","length":434,"id":"12-1-c74c8c871cfe33638a67894f25fabb060c53d5ba344cb31b38e6326490e04f76"}]},{"blocks":[{"type":"card_title","data":{"index":14,"text":"Что делать, если при обыске отнимают компьютер и телефон?"},"id":"13-0-c10ec0d549a02553bf521906c9b22af5bab5c4d5a6e97d060b5ea33c1b79bfeb"},{"type":"p","data":"К сожалению, ничего. Если вы опасаетесь, что вам могут потом загрузить опасную информацию — проследите, чтобы в протоколе обыска или осмотра зафиксировали способ упаковки и тут же заявите ходатайство, чтобы последующий осмотр телефона или компьютера был с вашим участием. И кстати — пора звонить адвокату. ","length":306,"id":"13-1-c6317b2b4b73bb79d9d091f4d5b9531fa2b8c6e815aab6d63003403438b17059"}]},{"blocks":[{"type":"card_title","data":{"index":15,"text":"Откуда у меня адвокат?"},"id":"14-0-6eb7221840245dc25dc3282575d1bdea3e69179eab8955f98c72272decaa7614"},{"type":"p","data":"Об адвокате нужно подумать заранее. Поддерживайте знакомства с адвокатами или юристами. Храните контакты таких знакомых в записной книжке телефона и отдельно на бумаге. Совет юриста в каждой конкретной ситуации будет более ценным и полезным, чем общее описание. Если у вас нет знакомого юриста или адвоката, посоветуйтесь с друзьями или зайдите в юридическую консультацию по месту жительства и обменяйтесь визитками с теми, кто там работает, пусть вас запомнят в лицо. ","length":469,"id":"14-1-aa4fd75a86d43460d1286c50d9a5755740f23af0eff07209b6f9f4559a51008d"}]},{"blocks":[{"type":"card_title","data":{"index":16,"text":"Ко мне домой могут прийти только полицейские? А если ФСБ?"},"id":"15-0-6fd8036d605bfd1bd9de2f13f0b90923d0937cca2ea8dc7a0845a96d86b21eca"},{"type":"p","data":"Чаще всего приходят полицейские. Сотрудники ФСБ или Следственного комитета тоже могут прийти и провести осмотр или обыск. Правила для них такие же: требуется ваше согласие или постановление следователя или суда.","length":211,"id":"15-1-31805c373b0af72c44ee7c94c68baddf4017de2bf7e05a146b9604c045f33bdb"}]},{"blocks":[{"type":"card_title","data":{"index":17,"text":"Как узнать больше о моих правах при общении с полицейскими?"},"id":"16-0-90ea46ac4e81465e50753e7fe1f1e6d0de272cb8db1b80ad01bb40f4271a2dbf"},{"type":"p","data":"На сайте проекта «Открытая полиция»: здесь есть и \u003Ca href=\"http:\u002F\u002Fopenpolice.ru\u002Fpages\u002Fpomosh\u002F\" rel=\"noopener\"\u003Eполезные советы на разные случаи жизни\u003C\u002Fa\u003E, и \u003Ca href=\"http:\u002F\u002Fopenpolice.ru\u002Fpages\u002Fponyatnaya-policiya\u002F\" rel=\"noopener\"\u003Eинформация о том, как устроена полиция\u003C\u002Fa\u003E. Если хотите, можете помочь проекту \u003Ca href=\"https:\u002F\u002Fplaneta.ru\u002Fcampaigns\u002Fopenpolice\" rel=\"noopener\"\u003Eиздать брошюру о полиции\u003C\u002Fa\u003E — распространяться она будет бесплатно. ","length":232,"id":"16-1-922c10f4009bbc84f9c6b07ce53b15962c271a30df609aa10626fb96f1249d7e"}]},{"blocks":[{"type":"donation","id":"0-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},{"type":"share","data":{"share":true,"bookmark":true,"pdf":{"standard":{"path":"\u002Fpdf\u002Fcards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"}},"unblock":{"standard":{"path":"\u002Funblock\u002Fcards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"}}},"id":"1-2c6ed366a50b73d0ff0bfe93c19aecc877ad2fdc75bd12b00afc949f954dc4a6"}]}]},"layout":"card","title":"Мне звонят в дверь, говорят: «Откройте, полиция!» Что делать?","chapters":{"count":17},"og":{"title":"Мне звонят в дверь, говорят: «Откройте, полиция!» Что делать? — Meduza","description":"Да, но это еще не значит, что к вам не может прийти полицейский. На вас может пожаловаться сосед снизу, которому не нравится громкая музыка. Или управляющая компания вместе с полицией решит провести рейд для выявления людей, живущих без регистрации. Так что на всякий случай нужно быть готовым к визиту людей в форме. «Медуза» попросила экспертов проекта Комитета гражданских инициатив «Открытая полиция» дать несколько ключевых советов по теме.","keywords":"новости, политика, расследование, репортаж, интервью, реакция, исследование, опрос, тест, президент, пригово he-sun"]},{"key":"feature\u002F2026\u002F07\u002F30\u002Fvoda-vonyaet-vozduh-vonyaet-gorod-zatoplen","starred":false,"origin":["under-the-sun"]},{"key":"feature\u002F2026\u002F07\u002F30\u002Fpomnite-bitvu-odisseya-s-gigantskimi-lestrigonami-v-stalnoy-brone-tak-vot-tam-geroya-igrala-kaskadersha-devin-dalton","starred":false,"origin":["under-the-sun"]},{"key":"feature\u002F2026\u002F07\u002F30\u002Fv-armenii-vozbudili-ugolovnoe-delo-protiv-blogera-iz-rossii-nadezhdy-pirozhkovoy-ona-vozmuschalas-tem-chto-na-prazdnik-vardavar-vse-oblivayutsya-vodoy","starred":false,"origin":["under-the-sun"]},{"key":"rotation\u002Frotatsiya-magaz-15-05-26","starred":false,"origin":["under-the-sun"]},{"key":"feature\u002F2026\u002F07\u002F28\u002Fmeduza-ischet-vneshtatnyh-avtorov-v-tsentrah-rossiyskoy-emigratsii","starred":false,"origin":["under-the-sun"]},{"key":"feature\u002F2026\u002F07\u002F14\u002Frabota-v-meduze-my-ischem-fotoredaktora","starred":false,"origin":["under-the-sun"]},{"key":"feature\u002F2026\u002F07\u002F02\u002Frabota-v-meduze-my-ischem-redaktora-v-otdel-novostey","starred":false,"origin":["under-the-sun"]}]],"og":{"title":"under-the-sun","description":"","keywords":"Медуза","url":"https:\u002F\u002Fmeduza.io\u002Fspecials\u002Funder-the-sun","image":"https:\u002F\u002Fmeduza.io\u002Fimage\u002Fattachments\u002Fimages\u002F006\u002F066\u002F471\u002Foriginal\u002Fd2Z43pdohOngOw-8C8xfVg.png"}}},"screenRequestStatus":"idle","underTheSunRequestStatus":"success","exchangeRatesRequestStatus":"idle","specialsRequestStatus":"idle"},"screensChronology":{},"materials":{"requestMaterialStatus":"success","requestStatStatus":"idle","requestUnblockLinkStatus":"idle","loadMoreLiveStatus":"idle","byId":{"cards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat":{"version":14,"url":"cards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat","content":{"head":[{"type":"tag","data":{"text":"разбор","theme":"gold"},"id":"0-aa138dd880aa804c7d7622e725dcd915353a5ca64dda7bb6c2280a36ffd03999"},{"type":"rich_title","data":{"first":"Мне звонят в дверь, говорят: «Откройте, полиция!» Что делать?"},"id":"1-3fd3d014daaeaac7b4b6299c01e016218c46993d849f50fc9e07ba5494279372"},{"type":"meta","data":{"lang":"ru","components":[{"type":"items_count","count":17,"id":"2a0c3d74d0a441b9222bb13163e08810227f3038fc562751eaf7692f450778f2"},{"type":"datetime","datetime":1463120037,"format":"date","id":"c346ca58791a949f9fd9842fa630697dda11e0c40abaf61ce6bc8c0962c80308"}]},"id":"2-884d331e66678e8bde2fac5a0888c59f5a8fe0a290465e52508ad175e26e7867"}],"cards":[{"blocks":[{"type":"card_title","data":{"index":1,"text":"Зачем мне это знать? Я же не преступник"},"id":"0-0-e6076217967a51cb213881144aa143dba51e7f35dfb4e1439b20db578c74e604"},{"type":"p","data":"Да, но это еще не значит, что к вам не может прийти полицейский. На вас может пожаловаться сосед снизу, которому не нравится громкая музыка. Или управляющая компания вместе с полицией решит провести рейд для выявления людей, живущих без регистрации. Так что на всякий случай нужно быть готовым к визиту людей в форме. «Медуза» попросила экспертов проекта \u003Ca href=\"https:\u002F\u002Fkomitetgi.ru\u002F\" rel=\"noopener\"\u003EКомитета гражданских инициатив\u003C\u002Fa\u003E \u003Ca href=\"http:\u002F\u002Fopenpolice.ru\u002F\" rel=\"noopener\"\u003E«Открытая полиция»\u003C\u002Fa\u003E дать несколько ключевых советов по теме.","length":445,"id":"0-1-2c3bbc53ed023df35b3524ab4bd254a018b9099bcb940f4c18f0a54fc6b4d573"}]},{"blocks":[{"type":"card_title","data":{"index":2,"text":"Хорошо. И что же делать, если в мою дверь звонит полицейский?"},"id":"1-0-0f84ef441c7e4503d9b5971ea5e4148b6939ee15441ab1440388cfe43e5dd204"},{"type":"p","data":"В первую очередь убедитесь, что к вам пришел именно полицейский. Попросите его представиться и предъявить служебное удостоверение в «глазок» или через цепочку. После того как полицейский представился, попросите его подождать и перепишите все данные. Сообщите о визите полиции родственникам или друзьям, продиктуйте им фамилию, имя, отчество, звание и должность сотрудника. Узнайте цель и причину визита сотрудника к вам домой, после чего примите решение, открывать дверь или нет.","length":479,"id":"1-1-b203e79ff6557220f984606d7d44f5ec0216f31e404c21b80cfeea944de2a231"}]},{"blocks":[{"type":"card_title","data":{"index":3,"text":"Как-то неловко заставлять человека ждать"},"id":"2-0-b777917c5e83ea7bd1a1737a1261cd92afd8bdbdfd20158fc51cb61f50893010"},{"type":"p","data":"Ничего страшного. Соблюдение законности и ваших прав, как и ваша безопасность, важнее этикета.","length":94,"id":"2-1-93aa81f3ba40a831f2687023b73f5fcb95554fca91a98221ebf111e7747605f6"}]},{"blocks":[{"type":"card_title","data":{"index":4,"text":"А если полицейский отказывается представляться?"},"id":"3-0-a86f391191b2f198999fc80449f5815de56b099d9c063ae3f60b23f34d9b38c8"},{"type":"p","data":"Тогда ни в коем случае не открывайте дверь. Звоните по номеру 112, своему участковому или в дежурную часть отдела полиции (телефон обычно можно быстро найти в интернете).","length":170,"id":"3-1-8d415317e4f5b0ab398f1f5f92bae2a19e24a687501200d563b73fa960dce2df"}]},{"blocks":[{"type":"card_title","data":{"index":5,"text":"Если не хочу открывать, полицейский имеет право сломать дверь?"},"id":"4-0-37eeb8ac8de847973704c64fd2a38ff883013bbc1ef1e6c0460f598f9dfe41d5"},{"type":"p","data":"Только в экстренных случаях. Все они прописаны в \u003Ca href=\"https:\u002F\u002Fwww.consultant.ru\u002Fdocument\u002Fcons_doc_LAW_110165\u002F3ff2278c1111420030bcbeb1f40164cf760b700e\u002F\" rel=\"noopener\"\u003Eстатье 15 закона «О полиции»\u003C\u002Fa\u003E.","length":78,"id":"4-1-b74e5767da8c525d962d41c4c0c5e3871fb9d67762089a1043044bd52c4604b6"},{"type":"p","data":"Вот список случаев, когда полицейский может войти в квартиру против вашей воли:","length":79,"id":"4-2-2508013eab6d20ec734051aa7cd3c9c47d05120c382ac3c2cb2fb19920fb5ad2"},{"type":"p","data":"1) для спасения жизни граждан и (или) их имущества, обеспечения безопасности граждан или общественной безопасности при массовых беспорядках и чрезвычайных ситуациях;","length":165,"id":"4-3-ac994e75632a7f4f340cf5e684c2f4a3c4687c39fa62bd26fda6d4f734d58d8f"},{"type":"p","data":"2) для задержания лиц, подозреваемых в совершении преступления;","length":63,"id":"4-4-d5010ce430fdf0f6b21f43944f3dbf6834c0471c87778af7317fbc3869e09d8b"},{"type":"p","data":"3) для пресечения преступления;","length":31,"id":"4-5-577032b7bd56213df392acf79f48fb0d60cc5818a3f5507746fad2a2065c1fa8"},{"type":"p","data":"4) для установления обстоятельств несчастного случая.","length":53,"id":"4-6-f5c0fd2f9ebb9cf20311eea42e22e6b0809714a87c4d2b6728fb8b9aaa8aba45"},{"type":"p","data":"Таким образом, если в вашей квартире не скрывается преступник, не совершается преступление, нет угрозы жизни или имуществу, а также не произошел несчастный случай, полицейский может войти к вам домой исключительно с вашего согласия. ","length":233,"id":"4-7-a0a401b3d133f959b17edd9ed4c332dd5f42153e43b3c49b92b852efe72490b5"}]},{"blocks":[{"type":"card_title","data":{"index":6,"text":"Полицейский говорит, что в квартире совершено преступление (или скрывается подозреваемый), хотя это ерунда. Что делать?"},"id":"5-0-6ecfeeacde7ee23b28f088d2ec27da75fe6ae64660cb389844bec3186b90530a"},{"type":"p","data":"Включите диктофон на телефоне и предупредите сотрудника, что вы ведете запись. Попросите его назвать номер КУСП или КРСП (так и произносите эти аббревиатуры, это покажет, что вы в теме), т. е. номер регистрации материала в книге учета сообщений о преступлениях \u002F сообщений о происшествиях, и дату регистрации. И телефон дежурной части — чтобы вы могли проверить, что такой материал проверки или сообщение зарегистрировано (даже если вам не скажут этого в дежурной части, ваш звонок туда будет записан). Скажите сотруднику следующее: «Если вы назовете мне номер регистрации сообщения, я подчинюсь вашим требованиям, но затем я обязательно обжалую факт проверки моей квартиры и попрошу прокуратуру и суд проверить весь материал, так как не считаю, что у вас на самом деле есть основания». ","length":787,"id":"5-1-50221d71108e2eee699d9dd60deff70cbcfd4dca861c9a68b2d3ef8386287163"}]},{"blocks":[{"type":"card_title","data":{"index":7,"text":"Сотрудник полиции просто требует открыть дверь, хотя своих целей не объясняет. Как себя вести?"},"id":"6-0-00c092ef77a9e6ab86b6d4bbe4fb73f4c975d3c9449dbd5177ae29d72484298b"},{"type":"p","data":"Вежливо, но строго. В случае, если визит полицейского не имеет законных оснований, спокойно сообщите сотруднику, что его действия неправомерны, предупредите его об уголовной ответственности за превышение полномочий, а также оставьте жалобу по телефону 112. Если полицейский говорит, что хочет «просто побеседовать», предложите ему оставить вам повестку или уточнить время и место приема. ","length":388,"id":"6-1-68a7f64dac2155cf89bef52bb021dc449200372f457d761650935177dc9ed288"}]},{"blocks":[{"type":"card_title","data":{"index":8,"text":"А если я уже открыл дверь и впустил полицейского в квартиру?"},"id":"7-0-007e61bf6b4f8fbd4c8022aa7c4310ed99865457accde059a95ac97f30a712fd"},{"type":"p","data":"Еще раз попросите его показать служебное удостоверение. Сверьте данные. Помните, что действия сотрудника, проникшего к вам в дом, должны быть ограничены рамками служебной необходимости. Тщательно фиксируйте все происходящее на мобильный телефон. И не забывайте: вы в любое время можете попросить полицейского покинуть квартиру.","length":327,"id":"7-1-17b13f6d99eb666d2b090f7a8e40adfc7ac6945be70ef603ff48b53704e14978"}]},{"blocks":[{"type":"card_title","data":{"index":9,"text":"С полицейским пришли сотрудники управляющих компаний. Нужно ли впускать их?"},"id":"8-0-a185a21756618a973fdc2ff5a7b474c81d33eed04bb3d66fa0274fe36abb9064"},{"type":"p","data":"Нет. Сотрудники управляющих компаний и частных охранных предприятий не имеют таких прав, как полиция. Пускать их в дом или нет — исключительно ваше дело. Даже если у полицейского есть законные основания войти к вам в дом, вы можете впустить полицию, а всех остальных оставить за дверью. ","length":287,"id":"8-1-fe59845b010a2f91586a9a87a264186a510ef0c4245fb0afc0e515622692d9ab"}]},{"blocks":[{"type":"card_title","data":{"index":10,"text":"Как поступить, если квартира, в которой я живу, съемная и полицейский требует предъявить договор аренды?"},"id":"9-0-a3e3a41f4bab9a1a11874f147395ef042a07140c849b1a8a033c7f8e5b86d5c0"},{"type":"p","data":"Напомнить полицейскому, что это требование незаконно. Аренда жилого помещения является элементом гражданско-правовых отношений. Сотрудники полиции не вправе проверять законность гражданских сделок. Поэтому просьбы полицейского предоставить договор аренды незаконны.","length":265,"id":"9-1-9b36af3ae3d4ac942b50fe3320572263cb2c4e1ed431a65c32a94b21c2e7bdc5"}]},{"blocks":[{"type":"card_title","data":{"index":11,"text":"Что делать, если у меня нет регистрации?"},"id":"10-0-82f173dbbd4311e21877dac9bacb71481975cf38d9a69999de00c12713f1285c"},{"type":"p","data":"В таком случае полицейский может составить протокол или вручить вам повестку для дачи объяснений. И то и другое можно сделать на лестничной площадке. Впускать его в квартиру вы не обязаны.","length":188,"id":"10-1-94f66d9c2aed7e56efb4939dde00403c42f461b4bfac73591684978edafe099e"}]},{"blocks":[{"type":"card_title","data":{"index":12,"text":"В каких случаях мою квартиру могут обыскать?"},"id":"11-0-38271fb3c8f9f9f17318c5fda11bc508a8ceb198bb9b5e8fd5fefd05b9796a8d"},{"type":"p","data":"Обыск в квартире проводится только на основании решения суда в рамках возбужденного уголовного дела. В исключительных случаях может быть постановление следователя. Во всех прочих случаях обыск незаконен. ","length":204,"id":"11-1-4db79ff3394732c6a861b765e7ba04bbd82672e3f97d113acca29be205b7df9f"},{"type":"p","data":"Перед началом обыска вам обязаны предъявить соответствующее постановление об обыске, а после — вручить копию протокола. ","length":120,"id":"11-2-e00926ff50f7031676ef780df32b5370790519d86ee1cbd02f512ca278d8ce8c"},{"type":"p","data":"Однако помимо обыска есть еще такое процессуальное действие, как «осмотр». Осмотр возможен до возбуждения уголовного дела, он может быть проведен в рамках проверки сообщения о преступлении. В теории уголовного процесса осмотр не подразумевает «переворачивания квартиры вверх дном», но на практике обыск и осмотр ничем не отличаются. Для осмотра квартиры нужно ваше согласие, а копия протокола вам не положена. ","length":410,"id":"11-3-a437f199671d4ecbf3df25558bb5a1af93a5ff65443eb5fdc1aa8ffb5900fa3b"}]},{"blocks":[{"type":"card_title","data":{"index":13,"text":"А если я не соглашаюсь на обыск или осмотр?"},"id":"12-0-eb3e17399e69f810f94c23d5eaaa11d28bcaad5d092aa8bb9a73129886fdc310"},{"type":"p","data":"И обыск, и осмотр можно провести без вашего согласия по постановлению следователя и по решению суда (они должны быть у полицейских, если проведение этих процедур поручено им). Решение суда о законности обыска или осмотра вы можете обжаловать в вышестоящем суде. Постановление следователя об осмотре или обыске будет направлено в суд в течение 24 часов для проверки законности, вы можете также успеть подать свою жалобу в районный суд.","length":434,"id":"12-1-c74c8c871cfe33638a67894f25fabb060c53d5ba344cb31b38e6326490e04f76"}]},{"blocks":[{"type":"card_title","data":{"index":14,"text":"Что делать, если при обыске отнимают компьютер и телефон?"},"id":"13-0-c10ec0d549a02553bf521906c9b22af5bab5c4d5a6e97d060b5ea33c1b79bfeb"},{"type":"p","data":"К сожалению, ничего. Если вы опасаетесь, что вам могут потом загрузить опасную информацию — проследите, чтобы в протоколе обыска или осмотра зафиксировали способ упаковки и тут же заявите ходатайство, чтобы последующий осмотр телефона или компьютера был с вашим участием. И кстати — пора звонить адвокату. ","length":306,"id":"13-1-c6317b2b4b73bb79d9d091f4d5b9531fa2b8c6e815aab6d63003403438b17059"}]},{"blocks":[{"type":"card_title","data":{"index":15,"text":"Откуда у меня адвокат?"},"id":"14-0-6eb7221840245dc25dc3282575d1bdea3e69179eab8955f98c72272decaa7614"},{"type":"p","data":"Об адвокате нужно подумать заранее. Поддерживайте знакомства с адвокатами или юристами. Храните контакты таких знакомых в записной книжке телефона и отдельно на бумаге. Совет юриста в каждой конкретной ситуации будет более ценным и полезным, чем общее описание. Если у вас нет знакомого юриста или адвоката, посоветуйтесь с друзьями или зайдите в юридическую консультацию по месту жительства и обменяйтесь визитками с теми, кто там работает, пусть вас запомнят в лицо. ","length":469,"id":"14-1-aa4fd75a86d43460d1286c50d9a5755740f23af0eff07209b6f9f4559a51008d"}]},{"blocks":[{"type":"card_title","data":{"index":16,"text":"Ко мне домой могут прийти только полицейские? А если ФСБ?"},"id":"15-0-6fd8036d605bfd1bd9de2f13f0b90923d0937cca2ea8dc7a0845a96d86b21eca"},{"type":"p","data":"Чаще всего приходят полицейские. Сотрудники ФСБ или Следственного комитета тоже могут прийти и провести осмотр или обыск. Правила для них такие же: требуется ваше согласие или постановление следователя или суда.","length":211,"id":"15-1-31805c373b0af72c44ee7c94c68baddf4017de2bf7e05a146b9604c045f33bdb"}]},{"blocks":[{"type":"card_title","data":{"index":17,"text":"Как узнать больше о моих правах при общении с полицейскими?"},"id":"16-0-90ea46ac4e81465e50753e7fe1f1e6d0de272cb8db1b80ad01bb40f4271a2dbf"},{"type":"p","data":"На сайте проекта «Открытая полиция»: здесь есть и \u003Ca href=\"http:\u002F\u002Fopenpolice.ru\u002Fpages\u002Fpomosh\u002F\" rel=\"noopener\"\u003Eполезные советы на разные случаи жизни\u003C\u002Fa\u003E, и \u003Ca href=\"http:\u002F\u002Fopenpolice.ru\u002Fpages\u002Fponyatnaya-policiya\u002F\" rel=\"noopener\"\u003Eинформация о том, как устроена полиция\u003C\u002Fa\u003E. Если хотите, можете помочь проекту \u003Ca href=\"https:\u002F\u002Fplaneta.ru\u002Fcampaigns\u002Fopenpolice\" rel=\"noopener\"\u003Eиздать брошюру о полиции\u003C\u002Fa\u003E — распространяться она будет бесплатно. ","length":232,"id":"16-1-922c10f4009bbc84f9c6b07ce53b15962c271a30df609aa10626fb96f1249d7e"}]},{"blocks":[{"type":"donation","id":"0-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},{"type":"share","data":{"share":true,"bookmark":true,"pdf":{"standard":{"path":"\u002Fpdf\u002Fcards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"}},"unblock":{"standard":{"path":"\u002Funblock\u002Fcards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"}}},"id":"1-2c6ed366a50b73d0ff0bfe93c19aecc877ad2fdc75bd12b00afc949f954dc4a6"}]}]},"layout":"card","title":"Мне звонят в дверь, говорят: «Откройте, полиция!» Что делать?","chapters":{"count":17},"og":{"title":"Мне звонят в дверь, говорят: «Откройте, полиция!» Что делать? — Meduza","description":"Да, но это еще не значит, что к вам не может прийти полицейский. На вас может пожаловаться сосед снизу, которому не нравится громкая музыка. Или управляющая компания вместе с полицией решит провести рейд для выявления людей, живущих без регистрации. Так что на всякий случай нужно быть готовым к визиту людей в форме. «Медуза» попросила экспертов проекта Комитета гражданских инициатив «Открытая полиция» дать несколько ключевых советов по теме.","keywords":"новости, политика, расследование, репортаж, интервью, реакция, исследование, опрос, тест, президент, приговор, доллар, нефть, экономика, цены, средства, информация, компания, фото, видео, украина, сепаратисты, война, краткий пересказ, бестселлер","url":"https:\u002F\u002Fmeduza.io\u002Fcards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat","image":"https:\u002F\u002Fmeduza.io\u002Fimgly\u002Fshare\u002F1565965779\u002Fcards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat","amp":false,"pdf":{"standard":{"path":"\u002Fpdf\u002Fcards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"}},"unblock":{"standard":{"path":"\u002Funblock\u002Fcards\u002Fmne-zvonyat-v-dver-govoryat-otkroyte-politsiya-chto-delat"}},"short":{"twitter":"https:\u002F\u0
