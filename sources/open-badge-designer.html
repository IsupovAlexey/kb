<!DOCTYPE html>
<html ng-app="app" lang="en">
<head ng-controller="MetaTagsCtrl as $ctrl">

  <meta name="description" content="{{ $ctrl.meta.description }}">
  <!-- OpenGraph -->
  <meta property="og:type" content="website" />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <!-- Twitter -->
  <meta name="twitter:card" content="{{ $ctrl.meta.twitter_card }}">
  <meta name="twitter:creator" content="@accredible">
  <meta name="twitter:description" content="Design and create open badge designs with the free Accredible badge designer. Export to SVG or PNG without having to register.">
  <meta name="twitter:image" content="/images/badge-designer-twitter-preview.jpg">
  <meta name="twitter:image:alt" content="Preview image showing the badge designer tool">

  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">

  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/spectrum/1.8.0/spectrum.min.css">

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'UA-38255894-7');

</head>
