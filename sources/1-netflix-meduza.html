Hpj\u002FUWcuanBn.webp","2x_webp":"\u002Fimpro\u002FL6JnRNgQs2alO3PKFoU5onZdw7GvnPJ6agoSsLNng3A\u002Fresizing_type:fit\u002Fwidth:1960\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjEvODQ5L29yaWdp\u002FbmFsL2hKcDN6RGFx\u002FUmYtR2lvS3l5aHpj\u002FUWcuanBn.webp"},"w1335":{"1x":"\u002Fimpro\u002FzrbXggqdITj7ihq15025RWMg7kFuNJ01WzXDharFyyg\u002Fresizing_type:fit\u002Fwidth:1335\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjEvODQ5L29yaWdp\u002FbmFsL2hKcDN6RGFx\u002FUmYtR2lvS3l5aHpj\u002FUWcuanBn.jpg","2x":"\u002Fimpro\u002F6sBGbOwlS4r5QHsXCRWhYuP9ls1PAa0HJtuX5P0lzkY\u002Fresizing_type:fit\u002Fwidth:2670\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjEvODQ5L29yaWdp\u002FbmFsL2hKcDN6RGFx\u002FUmYtR2lvS3l5aHpj\u002FUWcuanBn.jpg","1x_webp":"\u002Fimpro\u002Fzhcpo-3yvSQf32QY0DJB6iTQbIV2U-cpo9wFD6XMllc\u002Fresizing_type:fit\u002Fwidth:1335\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjEvODQ5L29yaWdp\u002FbmFsL2hKcDN6RGFx\u002FUmYtR2lvS3l5aHpj\u002FUWcuanBn.webp","2x_webp":"\u002Fimpro\u002FgVhf3rFQBVvlyc76DbCaGyRIqzlVw_kxil6h-0yxm2w\u002Fresizing_type:fit\u002Fwidth:2670\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjEvODQ5L29yaWdp\u002FbmFsL2hKcDN6RGFx\u002FUmYtR2lvS3l5aHpj\u002FUWcuanBn.webp"}}},"only_on":"desktop","id":"0-1eb9f771543c50f255675237aa9256ff8633e1550fcb1eb9d4556c05d975fb7f"},{"type":"lead","data":"В пятницу, 13-го, в онлайн-кинотеатре Netflix появился сериал «Охотник за разумом», необычный детектив, в котором все маньяки пойманы до начала событий — но от которого все равно сложно оторваться. Первые две серии (и последние две) снял режиссер Дэвид Финчер, а продюсирует шоу Шарлиз Терон. Кинокритик Егор Москвитин рассказывает, как Netflix сделал свой «Настоящий детектив».","id":"1-7c93c7b3561467a71319e86d9aa17fadd486e2e1007f034022a01d4b921c787b"},{"type":"lead_hr","id":"2-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},{"type":"p","data":"В первых двух сериях «Охотника за разумом», снятых режиссером Дэвидом Финчером, наблюдается специфическое чувство юмора. Психопат с дробовиком, уверенный в том, что он невидимка, выходит к полиции голышом — а переговорщик в духе «Грязного Гарри» незаметно шутит над ним: «Кажется, ты замерз». Первой же постельной сцене аккомпанирует песня группы 10сс «Iʼm Not in Love»\u003Cem\u003E,\u003C\u002Fem\u003E но кого герои этим пытаются обмануть? На титрах второй серии звучит баллада «Psycho Killer» от Talking Heads — а антигероем этой серии выступает Эд Кемпер, тихий улыбчивый увалень размером со шкаф, который отрезал собственной матери голову, чтобы заняться с этой головой сексом.","length":649,"id":"3-ef8fe147c06dd96dfbb166e08f931d574fe6ff5834f40c0ba32533cb30987eea"},{"type":"p","data":"У компании Netflix, в отличие от многих из нас, был четкий план на уходящий год: выпустить тысячу часов оригинального контента — в виде кино или сериалов. Впрочем, рубеж между кино и сериалами в понимании Netflix так же условен, как граница США и Канады в районе Ниагарского водопада (по обе его стороны полно туристов, наряженных в дождевики разных цветов — чтоб не перепутать, если кто-то заплывет за буйки).","length":410,"id":"4-f9c0d32152538de562fca4589703802eff3048a7195060aa1aeffe8f9821b267"},{"type":"p","data":"Вышедшие неделю назад нетфликсовские «Истории семьи Майровиц» — вроде бы фильм: в кадре Дастин Хоффман, Эмма Томпсон, Бен Стиллер и Адам Сэндлер, за кадром любимец сентиментальных эстетов сценарист и режиссер Ноа Баумбах, в резюме участие в основном конкурсе Каннского фестиваля. Но каждая история — 20-минутный скетч, почти ситком, как у Вуди Аллена в снятом для Amazon сериале \u003Ca href=\"https:\u002F\u002Fmeduza.io\u002Ffeature\u002F2016\u002F10\u002F02\u002Fkrizis-v-shesti-stsenah-serial-ot-vudi-allena-s-mayli-sayrus-v-glavnoy-roli\" target=\"_blank\" rel=\"noopener\"\u003E«Кризисе в шести сценах»\u003C\u002Fa\u003E (только лучше).","length":419,"id":"5-7f6718eaa9ea5ae925d641698c80ce06e7f0c62ad73808a3944b874a03d37612"},{"type":"p","data":"Выходящие через неделю нетфликсовские \u003Ca href=\"https:\u002F\u002Fmeduza.io\u002Fshapito\u002F2017\u002F07\u002F23\u002Fpervyy-treyler-prodolzheniya-ochen-strannyh-del-strashno\" target=\"_blank\" rel=\"noopener\"\u003E«Очень странные дела»\u003C\u002Fa\u003E — вроде бы сериал: второй сезон, новая тема, но старые и понятные герои. Однако все эпизоды как обычно появятся сразу, причем в Хэллоуин, так что фанатов ждет настоящая ночь кино. Скорее всего, это будет один большой фильм в духе двух святых Стивенов — Спилберга и Кинга.","length":331,"id":"6-a6b86ca8dc4a5ca202e0232dbe15dae81c95605103d737c47f5ae45708e2a92c"},{"type":"p","data":"Та же история и с «Охотником за разумом», который и не кино, даром что два первых эпизода снял Дэвид Финчер (и последних два тоже), и не сериал, хоть и длится почти 500 минут. Это самое бесструктурное повествование, с которым мы сталкивались, возможно, с самого запуска Netflix. Философский хаос «Настоящего детектива» HBO на фоне «Охотника за разумом» кажется стройной симфонией; а ленивое калифорнийское марево «Водолея» с Дэвидом Духовны — остросюжетным полицейским боевиком.","length":478,"id":"7-0ce7258c7997b33ed0a49234b336f910ebab741cae970f65f2a858744dde1f32"},{"type":"embed","data":{"provider":"youtube","html":"\u003Ciframe src=\"https:\u002F\u002Fwww.youtube.com\u002Fembed\u002FZo2-9cWTZGM?feature=oembed&amp;iv_load_policy=3&amp;showinfo=0&amp;color=white\" frameborder=\"0\" allowfullscreen style=\"width: 100%; height: 100%; position: absolute\"\u003E\u003C\u002Fiframe\u003E","width":480,"height":270,"lazy":true,"wrap_with_iframe":false,"caption":"Трейлер «Охотника за разумом»","credit":"New Trailers — Русские Трейлеры","cc":"default","display":"default"},"id":"8-7b5a54c5779eb286dd66dd932e764d3082a4caec5aacc7321b4d2335df9df3e7"},{"type":"p","data":"Первое отличие и от кино, и от сериалов — в том, что «Охотник за разумом» отказывается и от формулы\u003Cstrong\u003E \u003C\u002Fstrong\u003E«монстр недели» (то есть от отдельного расследования в каждой серии), и от сквозной драматургии. В отличие от недавнего мини-сериала \u003Ca href=\"https:\u002F\u002Fmeduza.io\u002Ffeature\u002F2017\u002F08\u002F09\u002Fmister-mersedes-nakonets-to-horoshaya-ekranizatsiya-stivena-kinga\" target=\"_blank\" rel=\"noopener\"\u003E«Унабомбер»\u003C\u002Fa\u003E, здесь нет постоянного повышения ставок и накаливания страстей. Герои просто делают свою работу — иногда удачно и быстро, а иногда мучительно долго. Герои — это Холден Форд и Билл Тенч, два агента ФБР, прототипы которых стояли у истоков криминального профилирования в США. Это они в беспокойные 1970-е научились слушать преступников, составлять их поведенческие портреты и использовать психологию в расследованиях и переговорах — а затем научили этому скептиков-коллег.","length":714,"id":"9-6d0ba47c7043a67386b11e10a91b1f4e7c20cc12ccf2a2420c2fee176b77e1a2"},{"type":"p","data":"В основе сериала — книга «Mindhunter: Inside the FBIʼs Elite Serial Crime Unit», бестселлер 1995 года, в котором фэбээровец Джон И. Дуглас пересказал свои встречи с самыми жуткими маньяками второй половины ХХ века. Среди серийных убийц, которых пытался понять Дуглас, — и некрофил Эд Кемпер, и ставший героем Стивена Кинга Дэннис Рейдер, и наряжавшийся в кожу своих жертв Эд Гин, и все еще живой Чарльз Мэнсон. В 1990-е и нулевые Дуглас охотно сотрудничал с Голливудом: с него срисован спецагент Джек Кроуфорд в трилогии о Ганнибале Лектере, а Питер Джексон советовался с ним во время съемок «Милых костей».","length":607,"id":"10-7ad1f5a61fe3084aea5f18c3fd650f2cb1f59b4d876dff13cdb1ebde72c0eb06"},{"type":"p","data":"Молодого Джона И. Дугласа сериал называет Холденом Фордом — чтобы иметь простор для фантазии. А его старшего товарища по ФБР Роберта Ресслера, который впоследствии придумает термин «серийный убийца», в «Охотнике за разумом» зовут Билл Тенч. Тенч и Форд — в переводе Рыба и Брод — имена не хуже \u003Ca href=\"https:\u002F\u002Fwww.kinopoisk.ru\u002Ffilm\u002Fbuch-kessidi-i-sandens-kid-1969-421\u002F\" target=\"_blank\" rel=\"noopener\"\u003EСанденса Кида и Бутча Кэссиди\u003C\u002Fa\u003E из классического вестерна с Полом Ньюманом и Робертом Редфордом. Стоит ли говорить, что встреча двух агентов-чудаков в 1977 году становится началом прекрасной дружбы? У актерского дуэта Джонатана Гроффа («В поиске», «Босс», «Хор») и Холта Маккаллани (работавшего у Финчера в «Чужом 3»)\u003Cstrong\u003E \u003C\u002Fstrong\u003Eнет звездного лоска тандема Питт-Морган или Макконахи-Харрельсон, но оно и к лучшему: так зрителю легче смотреть на мир глазами героев. А это — обязательное условие; иначе ничего не выйдет. Из вечно неуверенного Гроффа получается отличный Холден Форд; из не очень востребованного в Голливуде актера Маккалани — убедительный Билл Тенч, человек, выполняющий свою работу, не особо надеясь в результат.","length":1008,"id":"11-91a9a1425ed6755d7369ae11213f69d7f3866ef8fff306f44115530ee3eebcbd"},{"type":"p","data":"Все эпизоды, кроме первого и второго, поставлены не Дэвидом Финчером, но заметить это не так-то и просто — как и поймать за руку исполнительного продюсера Шарлиз Терон, для которой это уже второй за год проект с Netflix после комедии «Начальница». Сериал стилизован под знаменитый триллер «Зодиак» так искусно, что воображение само достраивает нужные параллели и встраивает новую историю в давно знакомую мрачную финчеровскую реальность. К примеру, в «Охотнике за разумом» нет, собственно, охоты — все маньяки давно сидят в тюрьмах, а герои ходят к ним с сэндвичами и блокнотами. Но эта интеллектуальная игра гораздо страшнее городских квестов из других сериалов, а по уровню постановки максимально близка к сценам из «Молчания ягнят». Сериал снят с нетипичным для домашнего кино ультрашироким соотношением сторон \u003Ca href=\"https:\u002F\u002Fwww.youtube.com\u002Fwatch?v=g0scR-CbzpU\" target=\"_blank\" rel=\"noopener\"\u003E2.35:1\u003C\u002Fa\u003E. Поэтому потолки в местных тюрьмах низкие, воздух спертый, а лица героев находятся так близко, что зритель чувствует себя участником допроса. Такая съемка как бы заманивает его в клетку к хищникам, и выбраться обратно не так-то и просто.","length":1058,"id":"12-9b3b60d7977a7119351dbb5f4e3d4287cf6e0da6c4a584efdc9a407c021334fb"},{"type":"image","data":{"lazy":true,"fullscreen":false,"small_url":"\u002Fimage\u002Fattachments\u002Fimages\u002F002\u002F562\u002F453\u002Fsmall\u002FOEmMxSjrIExUMMWRoFcCXA.jpg","large_url":"\u002Fimage\u002Fattachments\u002Fimages\u002F002\u002F562\u002F453\u002Flarge\u002FOEmMxSjrIExUMMWRoFcCXA.jpg","elarge_url":"\u002Fimage\u002Fattachments\u002Fimages\u002F002\u002F562\u002F453\u002Felarge\u002FOEmMxSjrIExUMMWRoFcCXA.jpg","width":1280,"height":853,"caption":"Некрофил Эд Кемпер показывает агенту Форду, что его привлекает в людях","credit":"Merrick Morton \u002F Netflix","cc":"default","display":"default","optimized":{"original":"\u002Fimpro\u002FVPGj0FmJUvEBIMX0Ws5KoqUMleSq3iZ0XeqCDDMWRBI\u002Fresizing_type:fit\u002Fwidth:2670\u002Fheight:0\u002Fenlarge:0\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjIvNDUzL29yaWdp\u002FbmFsL09FbU14U2py\u002FSUV4VU1NV1JvRmND\u002FWEEuanBn.jpg","w325":{"1x":"\u002Fimpro\u002F2KometZ4HgBLnk2Kl8JeRdyfsKKuAI1ZQyvHak-y5TU\u002Fresizing_type:fit\u002Fwidth:325\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjIvNDUzL29yaWdp\u002FbmFsL09FbU14U2py\u002FSUV4VU1NV1JvRmND\u002FWEEuanBn.jpg","2x":"\u002Fimpro\u002FLzOpu7uMorvA0MGAzLgTPRQXa4g6X3 \u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjIvNDUzL29yaWdp\u002FbmFsL09FbU14U2py\u002FSUV4VU1NV1JvRmND\u002FWEEuanBn.webp"}}},"id":"13-96d71a6a3379961292d447e54783532ed2c6f44e14714794fd043a3db627d086"},{"type":"p","data":"Еще в «Охотнике за разумом» почти нет самих сцен убийств, которыми так пугали полнометражные детективы Финчера: изуродованные тела остаются или за кадром, или на фотографиях, мелькающих в руках героев. Но местные интервью с вампирами куда убедительнее любых атак с ножами. Слова могут быть гораздо страшнее действий. Особенно у Дэвида Финчера, у которого, как известно с «Бойцовского клуба», вообще проблемы с самоцензурой в диалогах. Когда на съемках экранизации Паланика режиссеру запретили использовать фразу Марлы Сингер «Я хочу от тебя аборт», он заменил ее на \u003Ca href=\"https:\u002F\u002Fwww.youtube.com\u002Fwatch?v=A8QwgfYiVpk\" target=\"_blank\" rel=\"noopener\"\u003Eкое-что похлеще\u003C\u002Fa\u003E. В «Охотнике за разумом» Финчера не сдерживает вообще ничего, поэтому в самом начале сериала некрофил Эд Кемпер очень спокойно описывает свои сексуальные опыты — а ближе к финалу должен появиться Эд Гин, реальный прототип Бейтмана из «Психо».","length":824,"id":"14-00f356687fe40228c62c62f5b969af4e2906a5a85ca34d057db60d9c2761c32f"},{"type":"p","data":"Корпорация Netflix, как известно, хочет захватить мир не только с помощью больших денег (только в 2017 году в производство контента было вложено шесть миллиардов долларов), но и с помощью big data. Умные алгоритмы анализируют, какие фильмы и сериалы смотрят представители разных демографических групп, и если игра стоит свеч, то для целевой аудитории снимается новое шоу. К примеру, ситком «Ранчо» с Эштоном Кутчером нацелен на Средний запад Америки — перспективную публику, которой еще только предстоит объяснить преимущества подписки на интернет-сервисы. На кого рассчитан медлительный, полудокументальный и бессовестно депрессивный «Охотник за разумом», посмотрев пару серий, понять сложно.","length":693,"id":"15-91217759edaacba51bd4aa1b0e9f6d4d2b974e774c79cad410573492b451c1a8"},{"type":"p","data":"Возможно, подсказка есть в исходных данных. 1977 год, позади и Вьетнам, и Уотергейт, и семья Мэнсона, и революция цветов. Общество взвинчено, а полицейские скучают по временам, когда за каждым преступлением стояли алчность или похоть — теперь убить могут и просто за косой взгляд. Герои сериала часто говорят о «раздельном мышлении», феноменальной особенности человека искренне верить во взаимоисключающие вещи. Мир усложняется, а мотивы монстров не объясняются: и сыщики, и маньяки прекрасно знают, как устроена теория игр, так что их многочасовые беседы не приносят надежных результатов. Финчер как обычно находит остроумный способ проиллюстрировать беспомощность амбициозного героя: тот во время секса с подружкой постоянно переспрашивает, получила ли она оргазм. «Охотник за разумом» бесструктурен не по вине сценаристов, а потому что так надо: кажется, это шоу для тех, кто ощущает, что теряет над жизнью контроль — и что дальше будет только хуже. Таких, судя по всему, много — сериал еще до запуска продлили на новый сезон.","length":1029,"id":"16-82cc5b86f9962d6dd2372e1d26e13cfdd4460c7fa94dab42392d662dc7f93019"},{"type":"donation","id":"18-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},{"type":"material_note","lang":"ru","data":[{"type":"note_caption","data":"\u003Cstrong\u003EЕгор Москвитин\u003C\u002Fstrong\u003E","length":14,"id":"19-0-c584acbfd2c25574a957664b0f1b925dd92c2851d5a6fc6df0df6e10cbc785bd"}],"id":"19-92ab5fe0080e7e25bb45321dc262992d1530218a5ef5e2f6b56878c3ff3f7d17"},{"type":"share","data":{"share":true,"bookmark":true,"pdf":{"standard":{"path":"\u002Fpdf\u002Ffeature\u002F2017\u002F10\u002F18\u002Fserial-ohotnik-za-razumom-devida-finchera-1-sezon"}},"unblock":{"standard":{"path":"\u002Funblock\u002Ffeature\u002F2017\u002F10\u002F18\u002Fserial-ohotnik-za-razumom-devida-finchera-1- vODQ5L29yaWdp\u002FbmFsL2hKcDN6RGFx\u002FUmYtR2lvS3l5aHpj\u002FUWcuanBn.webp","2x_webp":"\u002Fimpro\u002FgVhf3rFQBVvlyc76DbCaGyRIqzlVw_kxil6h-0yxm2w\u002Fresizing_type:fit\u002Fwidth:2670\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjEvODQ5L29yaWdp\u002FbmFsL2hKcDN6RGFx\u002FUmYtR2lvS3l5aHpj\u002FUWcuanBn.webp"}}},"only_on":"desktop","id":"0-1eb9f771543c50f255675237aa9256ff8633e1550fcb1eb9d4556c05d975fb7f"},{"type":"lead","data":"В пятницу, 13-го, в онлайн-кинотеатре Netflix появился сериал «Охотник за разумом», необычный детектив, в котором все маньяки пойманы до начала событий — но от которого все равно сложно оторваться. Первые две серии (и последние две) снял режиссер Дэвид Финчер, а продюсирует шоу Шарлиз Терон. Кинокритик Егор Москвитин рассказывает, как Netflix сделал свой «Настоящий детектив».","id":"1-7c93c7b3561467a71319e86d9aa17fadd486e2e1007f034022a01d4b921c787b"},{"type":"lead_hr","id":"2-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},{"type":"p","data":"В первых двух сериях «Охотника за разумом», снятых режиссером Дэвидом Финчером, наблюдается специфическое чувство юмора. Психопат с дробовиком, уверенный в том, что он невидимка, выходит к полиции голышом — а переговорщик в духе «Грязного Гарри» незаметно шутит над ним: «Кажется, ты замерз». Первой же постельной сцене аккомпанирует песня группы 10сс «Iʼm Not in Love»\u003Cem\u003E,\u003C\u002Fem\u003E но кого герои этим пытаются обмануть? На титрах второй серии звучит баллада «Psycho Killer» от Talking Heads — а антигероем этой серии выступает Эд Кемпер, тихий улыбчивый увалень размером со шкаф, который отрезал собственной матери голову, чтобы заняться с этой головой сексом.","length":649,"id":"3-ef8fe147c06dd96dfbb166e08f931d574fe6ff5834f40c0ba32533cb30987eea"},{"type":"p","data":"У компании Netflix, в отличие от многих из нас, был четкий план на уходящий год: выпустить тысячу часов оригинального контента — в виде кино или сериалов. Впрочем, рубеж между кино и сериалами в понимании Netflix так же условен, как граница США и Канады в районе Ниагарского водопада (по обе его стороны полно туристов, наряженных в дождевики разных цветов — чтоб не перепутать, если кто-то заплывет за буйки).","length":410,"id":"4-f9c0d32152538de562fca4589703802eff3048a7195060aa1aeffe8f9821b267"},{"type":"p","data":"Вышедшие неделю назад нетфликсовские «Истории семьи Майровиц» — вроде бы фильм: в кадре Дастин Хоффман, Эмма Томпсон, Бен Стиллер и Адам Сэндлер, за кадром любимец сентиментальных эстетов сценарист и режиссер Ноа Баумбах, в резюме участие в основном конкурсе Каннского фестиваля. Но каждая история — 20-минутный скетч, почти ситком, как у Вуди Аллена в снятом для Amazon сериале \u003Ca href=\"https:\u002F\u002Fmeduza.io\u002Ffeature\u002F2016\u002F10\u002F02\u002Fkrizis-v-shesti-stsenah-serial-ot-vudi-allena-s-mayli-sayrus-v-glavnoy-roli\" target=\"_blank\" rel=\"noopener\"\u003E«Кризисе в шести сценах»\u003C\u002Fa\u003E (только лучше).","length":419,"id":"5-7f6718eaa9ea5ae925d641698c80ce06e7f0c62ad73808a3944b874a03d37612"},{"type":"p","data":"Выходящие через неделю нетфликсовские \u003Ca href=\"https:\u002F\u002Fmeduza.io\u002Fshapito\u002F2017\u002F07\u002F23\u002Fpervyy-treyler-prodolzheniya-ochen-strannyh-del-strashno\" target=\"_blank\" rel=\"noopener\"\u003E«Очень странные дела»\u003C\u002Fa\u003E — вроде бы сериал: второй сезон, новая тема, но старые и понятные герои. Однако все эпизоды как обычно появятся сразу, причем в Хэллоуин, так что фанатов ждет настоящая ночь кино. Скорее всего, это будет один большой фильм в духе двух святых Стивенов — Спилберга и Кинга.","length":331,"id":"6-a6b86ca8dc4a5ca202e0232dbe15dae81c95605103d737c47f5ae45708e2a92c"},{"type":"p","data":"Та же история и с «Охотником за разумом», который и не кино, даром что два первых эпизода снял Дэвид Финчер (и последних два тоже), и не сериал, хоть и длится почти 500 минут. Это самое бесструктурное повествование, с которым мы сталкивались, возможно, с самого запуска Netflix. Философский хаос «Настоящего детектива» HBO на фоне «Охотника за разумом» кажется стройной симфонией; а ленивое калифорнийское марево «Водолея» с Дэвидом Духовны — остросюжетным полицейским боевиком.","length":478,"id":"7-0ce7258c7997b33ed0a49234b336f910ebab741cae970f65f2a858744dde1f32"},{"type":"embed","data":{"provider":"youtube","html":"\u003Ciframe src=\"https:\u002F\u002Fwww.youtube.com\u002Fembed\u002FZo2-9cWTZGM?feature=oembed&amp;iv_load_policy=3&amp;showinfo=0&amp;color=white\" frameborder=\"0\" allowfullscreen style=\"width: 100%; height: 100%; position: absolute\"\u003E\u003C\u002Fiframe\u003E","width":480,"height":270,"lazy":true,"wrap_with_iframe":false,"caption":"Трейлер «Охотника за разумом»","credit":"New Trailers — Русские Трейлеры","cc":"default","display":"default"},"id":"8-7b5a54c5779eb286dd66dd932e764d3082a4caec5aacc7321b4d2335df9df3e7"},{"type":"p","data":"Первое отличие и от кино, и от сериалов — в том, что «Охотник за разумом» отказывается и от формулы\u003Cstrong\u003E \u003C\u002Fstrong\u003E«монстр недели» (то есть от отдельного расследования в каждой серии), и от сквозной драматургии. В отличие от недавнего мини-сериала \u003Ca href=\"https:\u002F\u002Fmeduza.io\u002Ffeature\u002F2017\u002F08\u002F09\u002Fmister-mersedes-nakonets-to-horoshaya-ekranizatsiya-stivena-kinga\" target=\"_blank\" rel=\"noopener\"\u003E«Унабомбер»\u003C\u002Fa\u003E, здесь нет постоянного повышения ставок и накаливания страстей. Герои просто делают свою работу — иногда удачно и быстро, а иногда мучительно долго. Герои — это Холден Форд и Билл Тенч, два агента ФБР, прототипы которых стояли у истоков криминального профилирования в США. Это они в беспокойные 1970-е научились слушать преступников, составлять их поведенческие портреты и использовать психологию в расследованиях и переговорах — а затем научили этому скептиков-коллег.","length":714,"id":"9-6d0ba47c7043a67386b11e10a91b1f4e7c20cc12ccf2a2420c2fee176b77e1a2"},{"type":"p","data":"В основе сериала — книга «Mindhunter: Inside the FBIʼs Elite Serial Crime Unit», бестселлер 1995 года, в котором фэбээровец Джон И. Дуглас пересказал свои встречи с самыми жуткими маньяками второй половины ХХ века. Среди серийных убийц, которых пытался понять Дуглас, — и некрофил Эд Кемпер, и ставший героем Стивена Кинга Дэннис Рейдер, и наряжавшийся в кожу своих жертв Эд Гин, и все еще живой Чарльз Мэнсон. В 1990-е и нулевые Дуглас охотно сотрудничал с Голливудом: с него срисован спецагент Джек Кроуфорд в трилогии о Ганнибале Лектере, а Питер Джексон советовался с ним во время съемок «Милых костей».","length":607,"id":"10-7ad1f5a61fe3084aea5f18c3fd650f2cb1f59b4d876dff13cdb1ebde72c0eb06"},{"type":"p","data":"Молодого Джона И. Дугласа сериал называет Холденом Фордом — чтобы иметь простор для фантазии. А его старшего товарища по ФБР Роберта Ресслера, который впоследствии придумает термин «серийный убийца», в «Охотнике за разумом» зовут Билл Тенч. Тенч и Форд — в переводе Рыба и Брод — имена не хуже \u003Ca href=\"https:\u002F\u002Fwww.kinopoisk.ru\u002Ffilm\u002Fbuch-kessidi-i-sandens-kid-1969-421\u002F\" target=\"_blank\" rel=\"noopener\"\u003EСанденса Кида и Бутча Кэссиди\u003C\u002Fa\u003E из классического вестерна с Полом Ньюманом и Робертом Редфордом. Стоит ли говорить, что встреча двух агентов-чудаков в 1977 году становится началом прекрасной дружбы? У актерского дуэта Джонатана Гроффа («В поиске», «Босс», «Хор») и Холта Маккаллани (работавшего у Финчера в «Чужом 3»)\u003Cstrong\u003E \u003C\u002Fstrong\u003Eнет звездного лоска тандема Питт-Морган или Макконахи-Харрельсон, но оно и к лучшему: так зрителю легче смотреть на мир глазами героев. А это — обязательное условие; иначе ничего не выйдет. Из вечно неуверенного Гроффа получается отличный Холден Форд; из не очень востребованного в Голливуде актера Маккалани — убедительный Билл Тенч, человек, выполняющий свою работу, не особо надеясь в результат.","length":1008,"id":"11-91a9a1425ed6755d7369ae11213f69d7f3866ef8fff306f44115530ee3eebcbd"},{"type":"p","data":"Все эпизоды, кроме первого и второго, поставлены не Дэвидом Финчером, но заметить это не так-то и просто — как и поймать за руку исполнительного продюсера Шарлиз Терон, для которой это уже второй за год проект с Netflix после комедии «Начальница». Сериал стилизован под знаменитый триллер «Зодиак» так искусно, что воображение само достраивает нужные параллели и встраивает новую историю в давно знакомую мрачную финчеровскую реальность. К примеру, в «Охотнике за разумом» нет, собственно, охоты — все маньяки давно сидят в тюрьмах, а герои ходят к ним с сэндвичами и блокнотами. Но эта интеллектуальная игра гораздо страшнее городских квестов из других сериалов, а по уровню постановки максимально близка к сценам из «Молчания ягнят». Сериал снят с нетипичным для домашнего кино ультрашироким соотношением сторон \u003Ca href=\"https:\u002F\u002Fwww.youtube.com\u002Fwatch?v=g0scR-CbzpU\" target=\"_blank\" rel=\"noopener\"\u003E2.35:1\u003C\u002Fa\u003E. Поэтому потолки в местных тюрьмах низкие, воздух спертый, а лица героев находятся так близко, что зритель чувствует себя участником допроса. Такая съемка как бы заманивает его в клетку к хищникам, и выбраться обратно не так-то и просто.","length":1058,"id":"12-9b3b60d7977a7119351dbb5f4e3d4287cf6e0da6c4a584efdc9a407c021334fb"},{"type":"image","data":{"lazy":true,"fullscreen":false,"small_url":"\u002Fimage\u002Fattachments\u002Fimages\u002F002\u002F562\u002F453\u002Fsmall\u002FOEmMxSjrIExUMMWRoFcCXA.jpg","large_url":"\u002Fimage\u002Fattachments\u002Fimages\u002F002\u002F562\u002F453\u002Flarge\u002FOEmMxSjrIExUMMWRoFcCXA.jpg","elarge_url":"\u002Fimage\u002Fattachments\u002Fimages\u002F002\u002F562\u002F453\u002Felarge\u002FOEmMxSjrIExUMMWRoFcCXA.jpg","width":1280,"height":853,"caption":"Некрофил Эд Кемпер показывает агенту Форду, что его привлекает в людях","credit":"Merrick Morton \u002F Netflix","cc":"default","display":" d_yhSAhoA\u002Fresizing_type:fit\u002Fwidth:2670\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjIvNDUzL29yaWdp\u002FbmFsL09FbU14U2py\u002FSUV4VU1NV1JvRmND\u002FWEEuanBn.jpg","1x_webp":"\u002Fimpro\u002F8lH0o-pRO80Qufbjvkra_5EZxDXg6EYlfahLRPZ2IRo\u002Fresizing_type:fit\u002Fwidth:1335\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjIvNDUzL29yaWdp\u002FbmFsL09FbU14U2py\u002FSUV4VU1NV1JvRmND\u002FWEEuanBn.webp","2x_webp":"\u002Fimpro\u002FnZX1FRV8V3PC5fxUlfxW60dJjeUa76TTcNf4_gayHsc\u002Fresizing_type:fit\u002Fwidth:2670\u002Fheight:0\u002Fenlarge:1\u002Fquality:80\u002FaHR0cHM6Ly9tZWR1\u002FemEuaW8vaW1hZ2Uv\u002FYXR0YWNobWVudHMv\u002FaW1hZ2VzLzAwMi81\u002FNjIvNDUzL29yaWdp\u002FbmFsL09FbU14U2py\u002FSUV4VU1NV1JvRmND\u002FWEEuanBn.webp"}}},"id":"13-96d71a6a3379961292d447e54783532ed2c6f44e14714794fd043a3db627d086"},{"type":"p","data":"Еще в «Охотнике за разумом» почти нет самих сцен убийств, которыми так пугали полнометражные детективы Финчера: изуродованные тела остаются или за кадром, или на фотографиях, мелькающих в руках героев. Но местные интервью с вампирами куда убедительнее любых атак с ножами. Слова могут быть гораздо страшнее действий. Особенно у Дэвида Финчера, у которого, как известно с «Бойцовского клуба», вообще проблемы с самоцензурой в диалогах. Когда на съемках экранизации Паланика режиссеру запретили использовать фразу Марлы Сингер «Я хочу от тебя аборт», он заменил ее на \u003Ca href=\"https:\u002F\u002Fwww.youtube.com\u002Fwatch?v=A8QwgfYiVpk\" target=\"_blank\" rel=\"noopener\"\u003Eкое-что похлеще\u003C\u002Fa\u003E. В «Охотнике за разумом» Финчера не сдерживает вообще ничего, поэтому в самом начале сериала некрофил Эд Кемпер очень спокойно описывает свои сексуальные опыты — а ближе к финалу должен появиться Эд Гин, реальный прототип Бейтмана из «Психо».","length":824,"id":"14-00f356687fe40228c62c62f5b969af4e2906a5a85ca34d057db60d9c2761c32f"},{"type":"p","data":"Корпорация Netflix, как известно, хочет захватить мир не только с помощью больших денег (только в 2017 году в производство контента было вложено шесть миллиардов долларов), но и с помощью big data. Умные алгоритмы анализируют, какие фильмы и сериалы смотрят представители разных демографических групп, и если игра стоит свеч, то для целевой аудитории снимается новое шоу. К примеру, ситком «Ранчо» с Эштоном Кутчером нацелен на Средний запад Америки — перспективную публику, которой еще только предстоит объяснить преимущества подписки на интернет-сервисы. На кого рассчитан медлительный, полудокументальный и бессовестно депрессивный «Охотник за разумом», посмотрев пару серий, понять сложно.","length":693,"id":"15-91217759edaacba51bd4aa1b0e9f6d4d2b974e774c79cad410573492b451c1a8"},{"type":"p","data":"Возможно, подсказка есть в исходных данных. 1977 год, позади и Вьетнам, и Уотергейт, и семья Мэнсона, и революция цветов. Общество взвинчено, а полицейские скучают по временам, когда за каждым преступлением стояли алчность или похоть — теперь убить могут и просто за косой взгляд. Герои сериала часто говорят о «раздельном мышлении», феноменальной особенности человека искренне верить во взаимоисключающие вещи. Мир усложняется, а мотивы монстров не объясняются: и сыщики, и маньяки прекрасно знают, как устроена теория игр, так что их многочасовые беседы не приносят надежных результатов. Финчер как обычно находит остроумный способ проиллюстрировать беспомощность амбициозного героя: тот во время секса с подружкой постоянно переспрашивает, получила ли она оргазм. «Охотник за разумом» бесструктурен не по вине сценаристов, а потому что так надо: кажется, это шоу для тех, кто ощущает, что теряет над жизнью контроль — и что дальше будет только хуже. Таких, судя по всему, много — сериал еще до запуска продлили на новый сезон.","length":1029,"id":"16-82cc5b86f9962d6dd2372e1d26e13cfdd4460c7fa94dab42392d662dc7f93019"},{"type":"donation","id":"18-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},{"type":"material_note","lang":"ru","data":[{"type":"note_caption","data":"\u003Cstrong\u003EЕгор Москвитин\u003C\u002Fstrong\u003E","length":14,"id":"19-0-c584acbfd2c25574a957664b0f1b925dd92c2851d5a6fc6df0df6e10cbc785bd"}],"id":"19-92ab5fe0080e7e25bb45321dc262992d1530218a5ef5e2f6b56878c3ff3f7d17"},{"type":"share","data":{"share":true,"bookmark":true,"pdf":{"standard":{"path":"\u002Fpdf\u002Ffeature\u002F2017\u002F10\u002F18\u002Fserial-ohotnik-za-razumom-devida-finchera-1-sezon"}},"unblock":{"standard":{"path":"\u002Funblock\u002Ffeature\u002F2017\u002F10\u002F18\u002Fserial-ohotnik-za-razumom-devida-finchera-1-sezon"}}},"id":"20-abe572e03febb5bc33efb8711ad2de85fa72c2c33e09b71a5f0016c97f152105"}],"footnotes":{"463960":{"title":"Криминальное профилирование","body":"\u003Cp\u003EКриминальное профилирование — анализ места преступления и применение полученной информации для определения личности преступника. Позволяет сузить круг подозреваемых. \u003C\u002Fp\u003E"}}},"layout":"rich","title":"Сериал «Охотник за разумом» Дэвида Финчера, 1 сезон","second_title":"У Netflix наконец-то появился свой «Настоящий детектив»","og":{"title":"Сериал «Охотник за разумом» Дэвида Финчера, 1 сезон У Netflix наконец-то появился свой «Настоящий детектив» — Meduza","description":"В пятницу, 13-го, в онлайн-кинотеатре Netflix появился сериал «Охотник за разумом», необычный детектив, в котором все маньяки пойманы до начала событий — но от которого все равно сложно оторваться. Первые две серии (и последние две) снял режиссер Дэвид Финчер, а продюсирует шоу Шарлиз Терон. Кинокритик Егор Москвитин рассказывает, как Netflix сделал свой «Настоящий детектив».","keywords":"новости, политика, расследование, репортаж, интервью, реакция, исследование, опрос, тест, президент, приговор, доллар, нефть, экономика, цены, средства, информация, компания, фото, видео, украина, сепаратисты, войн
