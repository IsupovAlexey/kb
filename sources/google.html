Навыки\ndependency injection\nнаписание тестов (желательно уметь)\nасинхронное программирование\nработа с системами контроля версий (mercurial / git)\nSQL\nLINQ\nWebAPI\nFrontend: опыт работы с Javascript (jQuery, KnockoutJS) и Html. В основном необходимо работать с легаси приложением, в принципе любой опыт Javascript сгодится.\n\nС backend частью Володя более-менее разобрался хотя бы в плане поддержки и внесения изменений в Игровую зону. Сложнее ему даётся разработка по новым приложениям. С Frontend частью ему тоже всё ещё очень трудно.\n\nРабота DevOps\nЭти обязанности сильно отличаются от тех, что выше, людей которые умеют всё сразу довольно мало, обычно это отдельная должность).\nАдминистрирование Windows / Linux серверов. В целом тут нужно хотя бы способность поднять веб-приложение .Net Framework по инструкции, и немного уметь конфигурировать IIS / nginx. Необходимо на случай изменения конфигурации или переноса каких-либо серверов.\nКонфигурирование и работа с TeamCity. Необходимо для настройки деплоя приложений. Пока что всё что есть работает, но если понадобится добавлять что-то новое, то это необходимо.\nОпыт работы с Docker. Нужно для деплоя новых приложений.\nПоддержание работоспособности приложений, инфраструктуры и реагирование на форс мажоры.\n\u000bВсё это Володя вообще или почти не делал/не умеет. Необходимость в этих умениях возникает неравномерно, можно чему-то научиться по ходу дела, но на это будет уходить время. Раньше мы это делали на троих с Сергеем Зининым и Вовой Ивановым, потом пришлось мне всё взять.\n\nОбязанности ведущего/старшего разработчика\nСпособность к управлению временем, т. к. задач может быть будет много и разноплановых, с переключением контекстов. \nУмение ставить себе и остальным задачи, распределять работу, ставить приоритеты, декомпозировать задачи на подзадачи, вести планирование, например, в Youtrack. Володю я к этому так и не приучил, к сожалению.\nСпособность проектировать решения в общем виде и архитектуру приложений, оф
