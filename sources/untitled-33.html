<script type="text/javascript">

function setBgStyle(color){
    $('body').removeClass();
    $('body').addClass(color + '-bgstyle');
    set_cookie('fw-read-bg-style', color);
}

function set_cookie(name, value, expires){
    if (!expires){
        expires = new Date();
    }
    document.cookie = name + "=" + escape(value) + ";";// expires=" + expires.toGMTString() +  "; path=/";
}

function delete_cookie(name){
    var d = new Date();
    document.cookie = name+"=1;expires=" + d.toGMTString() + ";" + ";";
}

function get_cookie(name){
    cookie_name = name + "=";
    cookie_length = document.cookie.length;
    cookie_begin = 0;
    while (cookie_begin < cookie_length){
        value_begin = cookie_begin + cookie_name.length;
        if (document.cookie.substring(cookie_begin, value_begin) == cookie_name){
            var value_end = document.cookie.indexOf (";", value_begin);
            if (value_end == -1){
                value_end = cookie_length;
            }
            return unescape(document.cookie.substring(value_begin, value_end));
        }
        cookie_begin = document.cookie.indexOf(" ", cookie_begin) + 1;
        if (cookie_begin == 0){
            break;
        }
    }
    return null;
}


$(document).ready( function() {

    String.prototype.repeat = function( num )
    {
        return new Array( num + 1 ).join( this );
    }

    var trigger, iecounter = 0;
    var progress = $("#progressbar");
    if(!$.browser.msie)
        progress.progressbar({ value: 0 });

    $.ajax({
        type: "GET",
        dataType: "text/xml",
        contentType: "application/x-www-form-urlencoded; charset=windows-1251",
        cache: $.browser.msie? false : true,
        error : function (xhr, _, e) {
            if(xhr.status == 404)
                alert("Error: file not found. Please, download archive and read the book using your favorite book reader.");
            else
                alert("Error: " + e.message);
        },
        url: "/module/get_fb2.php?id=1589",
        statusCode: {404: function() { alert('File does not exists!'); }},
        beforeSend : function (xhr) {
                trigger = setInterval (function () { 
                    if($.browser.msie) {
                        progress.html("Loading " + ".".repeat( ++iecounter ));
                        if(iecounter > 10 ) iecounter = 0;
                    } else {
                        if (xhr.readyState > 2) {
                            var total = xhr.getResponseHeader('Content-length');
                            var downloaded = xhr.responseText.length;

                            progress.progressbar({ value: Math.round( (downloaded / total) * 100 ) + 5 }); // i lied
                        }
                    }
                }, 200);
        },
        complete : function (xhr) {
            clearInterval(trigger);
            if($.browser.msie)
                progress.html("");
            else
                progress.progressbar( "destroy" );
        },
        success: function(data) {
            if(!data) {
                alert("Empty file");
                return;
            }
//+get xml
            var xmlDoc;
            if ( $.browser.msie ) { //IE >_____<
                xmlDoc = new ActiveXObject("Microsoft.XMLDOM");
                xmlDoc.async = false;
                xmlDoc.loadXML(data);
            } else if (window.DOMParser) {
                xmlDoc = new DOMParser();
                xmlDoc = xmlDoc.parseFromString(data, "text/xml");
            } else {
                alert("Your browser does not support xml.");
            }
            if(!xmlDoc) {
                alert("The book have an error.");
                return;
            }
            var root;
            try {
                root = xmlDoc.getElementsByTagName("FictionBook")[0];
                root.nodeName;
            } catch(e) {
                alert("File does not support fb2 specification(no FictionBook tag).");
                return;
            }
            var x_prefix = root.attributes["xmlns:xlink"] ? "xlink" : "l";
            
//-get xml

//parse xml function
            var img_list = new Array();

            function walker(parent, child) {
                if(child.nodeType == 3) { // TEXT_NODE
                    var text = document.createTextNode( $.browser.mozilla ? child.wholeText : child.nodeValue);
                    parent.appendChild(text);
                    return;
                }
                var tag_name = child.tagName;
                var new_tag_name = 'div';
                switch(tag_name) {
                    case "p" : new_tag_name = "p"; break;
		    case "sub": new_tag_name = "sub"; break;
		    case "sup": new_tag_name = "sup"; break;
                    case "a" : {
                        if(child.getAttribute("type") == "note") {
                            var sup = document.createElement("sup");
                            sup.setAttribute("class", "a note" );
                            var href = child.getAttribute($.browser.opera? "href" : x_prefix + ":href");
                            sup.setAttribute("href", href );
                            sup.textContent = child.textContent;
                            parent.appendChild(sup);
                            return;
                        } else {
                            var a = document.createElement("a");
                            a.setAttribute("class", "a href" );
                            var href = child.getAttribute($.browser.opera? "href" : x_prefix + ":href");
                            a.setAttribute("href", href );
                            a.textContent = child.textContent;
                            parent.appendChild(a);
                            return;
                        }
                    }
                    case "strong" : new_tag_name = "strong"; break;
                    case "empty-line" :
                        // if(child.childNodes.length==0)
                        //     return;
                        //new_name = "br";
                        parent.appendChild(document.createElement("br"));
                        return;
                    case "image" :
                        var img = document.createElement("img");
                        var href = child.getAttribute(x_prefix + ":href");
                        if(!href) href = child.getAttribute("href");
                        img.setAttribute("src", href);
                        if(href) img.setAttribute("title", href.substring(1));
                        parent.appendChild(img);
                        return;
                    case "binary" :
                        var img = new Array();
                        img["content-type"] = child.getAttribute("content-type");
                        var data = child.childNodes[0];
                        img["data"] = $.browser.mozilla ? data.wholeText : data.data; //fix ie url length plz
                        img_list["#" + child.getAttribute("id")] = img;
                        return;
                }

                var new_tag = document.createElement(new_tag_name);
                
                var id = child.getAttribute("id");
                if(id)
                    new_tag.setAttribute("id", id );

                if(new_tag_name != tag_name) new_tag.setAttribute("class", tag_name );

                var childs = child.childNodes;
                for(var i = 0; i < childs.length; i++) {
                    walker(new_tag, childs[i]);
                }
                parent.appendChild(new_tag);
            }
//-parse xml function
            var fragment = document.createDocumentFragment();
            walker(fragment , root);
            document.body.appendChild(fragment);

//+get info
            var title = $(".book-title").first().text();
            var author_tag = $(".title-info .author");
            var first_name = author_tag.find(".first-name").first().text();
            var last_name = author_tag.find(".last-name").first().text();
            
            var annotation = $(".annotation").first().text();
            
            $("div.body").first().prepend( $(".description").find("img") ); //push images from description
            $(".FictionBook > :not(.body)").remove();
            if($.browser.msie && $.browser.version < 8 ) {
                $("img").remove();
            }
            document.title = first_name + " " + last_name + " - " + title;
//-get info


//+functions
            var part = 0;
            function menu(root,item) {
                var title = $(item).children().filter(".title").first();
                if(!title.text()) return $("");
                $(title).attr( "id", "part" + part );
                var container = $("<li>").append( $("<a>", {text:title.text(), href:"#part" + part++} ) );
                
                var childs = $(item).children().filter(".section, .subsection");
                if(childs.length!=0) {
                    var new_item = $("<ul>");
                    for(var i = 0; i < childs.length; i++) {
                        menu(new_item, childs[i]);
                    }
                    container.append(new_item);
                }
                root.append( container );
                return root;
            }

//-functions

            menu( $("#nav"), $(".body:first") );
//menu
            $(" #nav ul ").css({display: "none"}); // Opera Fix
            $(" #nav li").hover(function(){
                $(this).find('ul:first').css({visibility: "visible",display: "none"}).show(400);
            },function(){
                $(this).find('ul:first').css({visibility: "hidden"});
                
            });
//images
            $("img").each( function() {
                var data = img_list[ $(this).attr("src") ];
                if(data) {
                    $(this).attr("src", "data:" + data["content-type"] + ";base64," + data["data"]);
                    $(this).css({
                        height:"auto",
                        width:"auto",
			"max-width":"75%"
                    });
                }
            });
//notes
            $("sup.note").each( function() {
                var href = $(this).attr("href");
                var expl = $(href).children().filter(":not(.title)");
                var text = $.trim( expl.text() );
                $(this).simpletip( { persistent: true, content:text } );
            });

	    var scrollpos = localStorage.getItem('_p1589');
            if (scrollpos) window.scrollTo(0, scrollpos);


	    window.addEventListener('scroll', function(e){
		localStorage.setItem('_p1589', window.scrollY);
	    });

        }
        //thats all, falks!
    });

    if(get_cookie('fw-read-bg-style') != "white" && get_cookie('fw-read-bg-style') != null){
        setBgStyle(get_cookie('fw-read-bg-style'));
    }

});

</script>
